<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upgrade to SwingRush Pro</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body { background:#05070d; color:#f4f6fb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .pay-wrap { max-width:520px; margin:0 auto; padding:40px 20px 80px; }
    .pay-back { color:#82a4ff; text-decoration:none; font-size:14px; display:inline-block; margin-bottom:24px; }
    .pay-title { font-size:26px; font-weight:800; margin-bottom:6px; }
    .pay-sub { color:#aab3cc; font-size:14px; margin-bottom:28px; }
    .pay-toggle { display:flex; background:#0d1220; border:1px solid rgba(255,255,255,0.09); border-radius:12px; padding:4px; margin-bottom:24px; }
    .pay-toggle button { flex:1; padding:10px; border:none; background:transparent; color:#aab3cc; font-weight:700; font-size:14px; border-radius:9px; cursor:pointer; }
    .pay-toggle button.active { background:#4f7dff; color:#fff; }
    .pay-card { background:#0d1220; border:1px solid rgba(255,255,255,0.09); border-radius:16px; padding:24px; margin-bottom:24px; }
    .pay-price { font-size:38px; font-weight:800; }
    .pay-price span { font-size:15px; color:#aab3cc; font-weight:600; }
    .pay-save { color:#00e676; font-size:13px; font-weight:700; margin-top:4px; }
    .pay-features { list-style:none; padding:0; margin:20px 0 0; }
    .pay-features li { padding:8px 0; color:#dfe3ee; font-size:14px; border-top:1px solid rgba(255,255,255,0.06); }
    #paypal-buttons { min-height:55px; margin-top:20px; }
    .pay-msg { text-align:center; font-size:14px; color:#aab3cc; margin-top:16px; }
    .pay-error { color:#ff5c7a; }
  </style>
</head>
<body>
  <div class="pay-wrap">
    <a href="/feed.html" class="pay-back"><span class="why-link-arrow" aria-hidden="true">&larr;</span> <span data-i18n="payment.back">Back</span></a>
    <div class="pay-title" data-i18n="payment.title">Upgrade to SwingRush Pro</div>
    <div class="pay-sub" data-i18n="payment.subtitle">Unlimited AI Signal Engine, Pro Engine analysis, and AI chat.</div>

    <div class="pay-toggle">
      <button id="btn-monthly" class="active" data-i18n="payment.monthly">Monthly</button>
      <button id="btn-yearly" data-i18n="payment.yearly">Yearly</button>
    </div>

    <div class="pay-card">
      <div class="pay-price" id="pay-price">$75<span>/ month</span></div>
      <div class="pay-save" id="pay-save" style="visibility:hidden;" data-i18n="payment.save_yearly">Save $200/year</div>
      <ul class="pay-features">
        <li data-i18n="payment.feat_1">Unlimited Signal Engine &amp; Pro Engine analysis</li>
        <li data-i18n="payment.feat_2">Unlimited AI chat with the trading analyst</li>
        <li data-i18n="payment.feat_3">Full ranked market scanner</li>
        <li data-i18n="payment.feat_4">Cancel anytime</li>
      </ul>
      <div id="paypal-buttons"></div>
      <div class="pay-msg" id="pay-msg"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    if (!Auth.require()) { /* redirected to login */ }

    let plans = null;
    let selectedCycle = 'monthly';
    let sdkLoaded = false;
    let currentUser = Auth.user(); // fullName/email from login cache immediately; phone filled in below

    function t(key, fallback) { return window.SRLang ? SRLang.t(key, fallback) : fallback; }

    function renderPrice() {
      const p = plans[selectedCycle];
      const perLabel = selectedCycle === 'yearly' ? t('payment.per_year', '/ year') : t('payment.per_month', '/ month');
      document.getElementById('pay-price').innerHTML = '$' + p.price + '<span>' + perLabel + '</span>';
      document.getElementById('pay-save').style.visibility = selectedCycle === 'yearly' ? 'visible' : 'hidden';
      document.getElementById('btn-monthly').classList.toggle('active', selectedCycle === 'monthly');
      document.getElementById('btn-yearly').classList.toggle('active', selectedCycle === 'yearly');
    }

    function renderButtons() {
      const container = document.getElementById('paypal-buttons');
      container.innerHTML = '';
      const planId = plans[selectedCycle].id;

      paypal.Buttons({
        style: { shape: 'pill', color: 'blue', layout: 'vertical', label: 'subscribe' },
        createSubscription: function (data, actions) {
          const sub = { plan_id: planId, custom_id: Auth.userId() };
          if (currentUser) {
            const parts = (currentUser.fullName || '').trim().split(/\s+/);
            sub.subscriber = {
              name: { given_name: parts[0] || '', surname: parts.slice(1).join(' ') || parts[0] || '' },
              email_address: currentUser.email,
            };
            if (currentUser.phone) {
              sub.subscriber.phone = { phone_type: 'MOBILE', phone_number: { national_number: String(currentUser.phone) } };
            }
          }
          return actions.subscription.create(sub);
        },
        onApprove: async function (data) {
          document.getElementById('pay-msg').textContent = t('payment.activating', 'Activating your Pro account...');
          document.getElementById('pay-msg').classList.remove('pay-error');
          try {
            await API.paymentConfirm({ subscriptionID: data.subscriptionID });
            document.getElementById('pay-msg').textContent = t('payment.activated', 'Pro activated! Redirecting...');
            setTimeout(function () { location.href = '/feed.html'; }, 1200);
          } catch (e) {
            document.getElementById('pay-msg').textContent = t('payment.activate_failed', 'Payment succeeded but activation failed:') + ' ' + e.message + '. ' + t('payment.contact_us', 'Contact swingrush.admin@gmail.com.');
            document.getElementById('pay-msg').classList.add('pay-error');
          }
        },
        onError: function (err) {
          console.error('PayPal error:', err);
          document.getElementById('pay-msg').textContent = t('payment.pay_failed', 'Payment could not be completed. Please try again.');
          document.getElementById('pay-msg').classList.add('pay-error');
        },
      }).render('#paypal-buttons');
    }

    async function init() {
      try {
        const cfg = await API.paymentConfig();
        plans = cfg.plans;
        renderPrice();

        API.me().then(function (res) { currentUser = Object.assign({}, currentUser, res.user); }).catch(function () {});

        const s = document.createElement('script');
        // enable-funding=card ensures guest debit/credit card checkout is offered,
        // not just login-with-PayPal.
        s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(cfg.clientId) +
          '&vault=true&intent=subscription&enable-funding=card&currency=USD';
        s.onload = function () { sdkLoaded = true; renderButtons(); };
        s.onerror = function () {
          document.getElementById('pay-msg').textContent = t('payment.sdk_failed', 'Could not load PayPal. Please refresh and try again.');
          document.getElementById('pay-msg').classList.add('pay-error');
        };
        document.body.appendChild(s);
      } catch (e) {
        document.getElementById('pay-msg').textContent = t('payment.config_failed', 'Could not load pricing:') + ' ' + e.message;
        document.getElementById('pay-msg').classList.add('pay-error');
      }
    }

    document.getElementById('btn-monthly').addEventListener('click', function () {
      selectedCycle = 'monthly'; renderPrice(); if (sdkLoaded) renderButtons();
    });
    document.getElementById('btn-yearly').addEventListener('click', function () {
      selectedCycle = 'yearly'; renderPrice(); if (sdkLoaded) renderButtons();
    });

    init();
  </script>
</body>
</html>
