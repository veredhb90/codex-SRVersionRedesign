<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us — SwingRush</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body { background: var(--bg); min-height:100vh; display:flex; flex-direction:column; position:relative; }
    .contact-wrap {
      flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px;
      position:relative; overflow:hidden;
      background:
        radial-gradient(ellipse 50% 60% at 20% 30%, rgba(79,125,255,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 70%, rgba(0,230,118,0.07) 0%, transparent 70%);
    }
    .contact-wrap::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:
        repeating-linear-gradient(0deg,transparent,transparent 48px,rgba(255,255,255,0.02) 48px,rgba(255,255,255,0.02) 49px),
        repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(255,255,255,0.02) 48px,rgba(255,255,255,0.02) 49px);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 75%);
              mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 75%);
    }
    .contact-card {
      position:relative; z-index:1;
      background: linear-gradient(165deg, rgba(79,125,255,0.07), rgba(13,18,32,0.5) 45%), rgba(11,15,26,0.75);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border:1px solid rgba(79,125,255,0.25);
      border-radius:22px; padding:50px 44px;
      width:100%; max-width:480px;
      box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 60px -30px rgba(79,125,255,0.35);
      animation:fadeUp .4s ease;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px);} }
    .contact-title {
      font-family:var(--font-disp); font-size:22px; letter-spacing:2px;
      text-align:center; color:#fff; margin-bottom:8px;
    }
    .contact-tagline { text-align:center; color:var(--muted); font-size:13px; margin-bottom:32px; }
    .btn-contact {
      width:100%; justify-content:center; font-size:16px;
      padding:14px; background:var(--accent); color:#fff; margin-top:4px;
    }
    .btn-contact:hover { background:var(--accent2); transform:translateY(-1px); box-shadow:0 4px 20px rgba(79,125,255,0.4); }
    @media (max-width:480px) {
      .contact-card { padding:36px 24px; border-radius:18px; }
    }
  </style>
  <link rel="stylesheet" href="/css/redesign.css?v=1786560030"/>
</head>
<body class="login-page">
<nav class="navbar">
  <a class="navbar-brand" href="/index.html">
    <span class="brand-dot"></span>
    <span class="brand-swing">SWING</span><span class="brand-rush">RUSH</span>
  </a>
  <div class="navbar-actions">
    <a href="/index.html#register" class="btn btn-green btn-sm" data-i18n="nav.join_free">Join Free</a>
  </div>
</nav>

<div class="contact-wrap">
  <div class="contact-card">
    <div class="contact-title" data-i18n="contact.title">CONTACT US</div>
    <div class="contact-tagline" data-i18n="contact.tagline">Questions, feedback, or an issue? We read every message.</div>

    <form id="contact-form">
      <div class="form-group">
        <label class="form-label" data-i18n="contact.name">Full Name</label>
        <input id="c-name" type="text" class="form-input" placeholder="John Smith" required autocomplete="name"/>
        <div class="form-error" id="e-c-name"></div>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="contact.email">Email</label>
        <input id="c-email" type="email" class="form-input" placeholder="your@email.com" required autocomplete="email"/>
        <div class="form-error" id="e-c-email"></div>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="contact.message">Message</label>
        <textarea id="c-message" class="form-input" style="width:100%;min-height:120px;resize:vertical;padding:12px 14px;" placeholder="How can we help?" data-i18n-placeholder="contact.message_placeholder" maxlength="5000" required></textarea>
        <div class="form-error" id="e-c-message"></div>
      </div>
      <button type="submit" class="btn btn-contact" id="contact-btn" data-i18n="contact.send">Send Message</button>
    </form>
  </div>
</div>

<script src="/js/api.js?v=1789711361"></script>
<script src="/js/i18n.js?v=1789711361"></script>
<script src="/js/auth.js"></script>
<script>
  document.getElementById('contact-form').addEventListener('submit', async e => {
    e.preventDefault();
    ['c-name','c-email','c-message'].forEach(f => { document.getElementById('e-'+f).textContent = ''; });
    const btn = document.getElementById('contact-btn');
    const name    = document.getElementById('c-name').value.trim();
    const email   = document.getElementById('c-email').value.trim();
    const message = document.getElementById('c-message').value.trim();

    let ok = true;
    if (name.length < 2)                { document.getElementById('e-c-name').textContent    = SRLang.t('contact.err_name', 'Enter your full name'); ok=false; }
    if (!/^\S+@\S+\.\S+$/.test(email))  { document.getElementById('e-c-email').textContent   = SRLang.t('contact.err_email', 'Enter a valid email'); ok=false; }
    if (message.length < 5)             { document.getElementById('e-c-message').textContent = SRLang.t('contact.err_message', 'Message is too short'); ok=false; }
    if (!ok) return;

    btn.disabled = true; btn.textContent = SRLang.t('contact.sending', 'Sending…');
    try {
      const res = await API.sendContact({ name, email, message });
      toast(res.message, 'success', 5000);
      document.getElementById('contact-form').reset();
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = SRLang.t('contact.send', 'Send Message');
    }
  });
</script>
</body>
</html>
