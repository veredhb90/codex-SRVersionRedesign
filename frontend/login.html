<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SwingRush</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body { background: var(--bg); min-height:100vh; display:flex; flex-direction:column; position:relative; }
    .login-wrap {
      flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px;
      position:relative; overflow:hidden;
      background:
        radial-gradient(ellipse 50% 60% at 20% 30%, rgba(79,125,255,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 70%, rgba(0,230,118,0.07) 0%, transparent 70%);
    }
    .login-wrap::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:
        repeating-linear-gradient(0deg,transparent,transparent 48px,rgba(255,255,255,0.02) 48px,rgba(255,255,255,0.02) 49px),
        repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(255,255,255,0.02) 48px,rgba(255,255,255,0.02) 49px);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 75%);
              mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 75%);
    }
    .login-card {
      position:relative; z-index:1;
      background: linear-gradient(165deg, rgba(79,125,255,0.07), rgba(13,18,32,0.5) 45%), rgba(11,15,26,0.75);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border:1px solid rgba(79,125,255,0.25);
      border-radius:22px; padding:50px 44px;
      width:100%; max-width:440px;
      box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 60px -30px rgba(79,125,255,0.35);
      animation:fadeUp .4s ease;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px);} }

    .login-logo {
      font-family:var(--font-disp); font-size:32px; letter-spacing:3px;
      display:flex; align-items:center; justify-content:center; gap:10px;
      margin-bottom:4px; line-height:1;
    }
    .login-logo .g { color:var(--green2); text-shadow:0 0 24px rgba(0,230,118,0.4); }
    .login-logo .r { color:var(--red2); }
    .login-tagline { text-align:center; color:var(--muted); font-size:13px; margin-bottom:32px; }

    /* Mini market strip */
    .mkt-strip {
      display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
      margin-bottom:28px;
    }
    .mkt-chip {
      font-family:var(--font-mono); font-size:11px;
      padding:3px 10px; border-radius:20px; border:1px solid;
    }
    .up-chip   { color:var(--green); border-color:var(--green); background:var(--green-bg); }
    .down-chip { color:var(--red);   border-color:var(--red);   background:var(--red-bg); }

    .login-title {
      font-family:var(--font-disp); font-size:20px; letter-spacing:2px;
      text-align:center; color:#fff; margin-bottom:22px;
    }
    .btn-login {
      width:100%; justify-content:center; font-size:16px;
      padding:14px; background:var(--accent); color:#fff; margin-top:4px;
    }
    .btn-login:hover { background:var(--accent2); transform:translateY(-1px); box-shadow:0 4px 20px rgba(79,125,255,0.4); }
    .login-footer { text-align:center; margin-top:22px; font-size:14px; color:var(--muted); }
    .login-footer a { color:var(--accent2); font-weight:700; text-decoration:none; }
    .login-footer a:hover { text-decoration:underline; }

    @media (max-width:480px) {
      .login-card { padding:36px 24px; border-radius:18px; }
      .login-logo { font-size:26px; }
      .mkt-strip { gap:6px; }
      .mkt-chip { font-size:10px; padding:3px 8px; }
    }
  </style>
  <link rel="stylesheet" href="/css/redesign.css?v=1786560030"/>
</head>
<body class="login-page">
<nav class="navbar">
  <a class="navbar-brand" href="/index.html">
    <span class="brand-dot"></span>
    <span class="brand-swing">SWING</span><span class="brand-rush">RUSH</span>
  </a>
  <div class="navbar-actions">
    <a href="/index.html#register" class="btn btn-green btn-sm" data-i18n="nav.join_free">Join Free</a>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="brand-dot"></span>
      <span class="brand-swing">SWING</span><span class="brand-rush">RUSH</span>
    </div>
    <div class="login-tagline" data-i18n="login.tagline">Financial Recommendation Network</div>

    <div class="mkt-strip" id="mkt-strip">
      <span class="mkt-chip up-chip">SPY ···</span>
      <span class="mkt-chip up-chip">GC=F ···</span>
      <span class="mkt-chip down-chip">CL=F ···</span>
    </div>

    <div class="login-title" data-i18n="login.title">TRADER LOGIN</div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" data-i18n="login.email">Email</label>
        <input id="l-email" type="email" class="form-input" placeholder="your@email.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="login.password">Password</label>
        <input id="l-pass" type="password" class="form-input" placeholder="••••••••••" required autocomplete="current-password"/>
        <div class="form-error" id="l-err"></div>
      </div>
      <button type="submit" class="btn btn-login" id="login-btn" data-i18n="login.button">Enter the Feed</button>
      <div style="text-align:center;margin-top:16px;">
        <button type="button" onclick="showForgotPassword()" style="background:none;border:none;color:var(--accent2);cursor:pointer;font-size:14px;text-decoration:underline;">
          <span data-i18n="login.forgot">Forgot your password?</span>
        </button>
      </div>

      <!-- Forgot password form -->
      <div id="forgot-section" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
        <p style="font-size:14px;color:var(--muted);margin-bottom:12px;" data-i18n="login.forgot_copy">Enter your email and we'll send you a new password.</p>
        <div class="form-group">
          <input id="forgot-email" type="email" class="form-input" placeholder="your@email.com"/>
        </div>
        <div class="form-error" id="forgot-err"></div>
        <button type="button" onclick="submitForgotPassword()" class="btn btn-primary" style="width:100%;justify-content:center;" id="forgot-btn">
          <span data-i18n="login.send_password">Send New Password</span>
        </button>
        <button type="button" onclick="hideForgotPassword()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;margin-top:8px;width:100%;">
          <span data-i18n="login.cancel">Cancel</span>
        </button>
      </div>
    </form>

    <div class="login-footer"><span data-i18n="login.new_trader">New trader?</span> <a href="/index.html#register" data-i18n="login.create">Create free account</a></div>
  </div>
</div>

<script src="/js/api.js?v=1786600856"></script>
<script src="/js/i18n.js?v=1786713974"></script>
<script>
  function showForgotPassword() {
    document.getElementById('forgot-section').style.display = 'block';
    document.getElementById('forgot-email').focus();
  }
  function hideForgotPassword() {
    document.getElementById('forgot-section').style.display = 'none';
    document.getElementById('forgot-err').textContent = '';
  }
  async function submitForgotPassword() {
    const email  = document.getElementById('forgot-email').value.trim();
    const errEl  = document.getElementById('forgot-err');
    const btn    = document.getElementById('forgot-btn');
    errEl.textContent = '';
    if (!email) { errEl.textContent = SRLang.t('login.enter_email', 'Enter your email'); return; }
    btn.disabled = true; btn.textContent = SRLang.t('login.sending', 'Sending…');
    try {
      const res = await API.forgotPassword({ email });
      toast(res.message, 'success', 5000);
      hideForgotPassword();
    } catch (err) {
      errEl.textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = SRLang.t('login.send_password', 'Send New Password');
    }
  }
</script>
<script src="/js/auth.js"></script>
<script>
  if (Auth.token()) location.href = '/feed.html';

  // Live market chips
  async function loadChips() {
    const syms  = ['SPY','GC=F','CL=F','AAPL','BTC-USD'];
    const strip = document.getElementById('mkt-strip');
    const res   = await Promise.allSettled(syms.map(s => API.quote(s)));
    strip.innerHTML = res.map((r,i) => {
      if (r.status !== 'fulfilled') return '';
      const q  = r.value;
      const up = (q.changePct||0) >= 0;
      return `<span class="mkt-chip ${up?'up-chip':'down-chip'}">
        ${syms[i]} $${(q.price||0).toFixed(2)} ${up?'▲':'▼'}${Math.abs(q.changePct||0).toFixed(2)}%
      </span>`;
    }).join('');
  }
  loadChips();

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = SRLang.t('login.logging_in', 'Logging in…');
    document.getElementById('l-err').textContent = '';

    try {
      const res = await API.login({
        email:    document.getElementById('l-email').value.trim(),
        password: document.getElementById('l-pass').value,
      });
      Auth.save(res.token, res.user);
      toast(SRLang.t('login.welcome_back', 'Welcome back,') + ' ' + (res.user.username ? '@'+res.user.username : res.user.fullName) + '! 🚀','success');
      setTimeout(() => location.href = '/feed.html', 500);
    } catch(err) {
      document.getElementById('l-err').textContent = err.message;
      btn.disabled = false; btn.textContent = SRLang.t('login.button', 'Enter the Feed');
    }
  });
</script>
</body>
</html>
